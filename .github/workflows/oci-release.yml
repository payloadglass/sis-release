# Assemble the SIS container image from PUBLISHED release artefacts.
#
# DEPLOY THIS TO: payloadglass/sis-release  ->  .github/workflows/oci-release.yml
# Source of truth: michiel/sis:deploy/oci-release/oci-release.yml  (see the README beside it)
#
# It cannot live in the private michiel/sis, for the same two reasons attest-release.yml cannot:
# `actions/attest-build-provenance` stores its attestation in the repo it RUNS in, that store must be
# PUBLIC to be verifiable, and a user-owned private repository cannot persist one at all.
#
# NOTHING IS REBUILT. This repackages the Linux archives the release already published, so there is
# no source, no Rust toolchain and no compilation — only assembly. That is what makes the binary in
# the image byte-identical to the binary in the archive, which is a stronger statement than any
# behavioural comparison between two separate builds could make.
#
# TRUST SEMANTICS, said plainly: the provenance predicate names THIS workflow as the builder. It
# attests "this image was assembled from these exact published bytes by this workflow" — publication
# provenance, not a cryptographic tie to the private source commit. Identical trade-off to
# attest-release.yml. Do not let the image's documentation imply more than the archives' does.

name: oci-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to assemble, e.g. v0.6.7"
        required: true
      push:
        description: "Push to GHCR. Leave false to build and validate only."
        required: false
        default: "false"

permissions:
  contents: read
  packages: write        # GHCR publication
  id-token: write        # Sigstore OIDC (keyless signing)
  attestations: write    # persist provenance to THIS (public) repo's attestation store

concurrency:
  group: oci-release-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sis

  # Declared once and used TWICE — as a per-platform LABEL and as an index annotation. They are
  # different mechanisms reaching different readers, and a description that lived in only one of
  # them is exactly how this was wrong the first time round.
  IMAGE_LICENSES: "NOASSERTION"
  IMAGE_DESCRIPTION: "SIS — multi-format document and container security analyser. Scans PDF, Office, archive and container formats for active content, obfuscation and AI-directed injection."

  # The runtime base, pinned by DIGEST so it cannot move under us.
  #
  # WHY TRIXIE AND NOT BOOKWORM. A GNU binary runs only on a glibc at least as new as the one it was
  # LINKED against, and the archives decide that, not this workflow. Measured 2026-08-26 against the
  # real v0.6.7 archives, which were built on the moving `ubuntu-latest`:
  #
  #     v0.6.7 requires        GLIBC_2.39
  #     debian:bookworm-slim   glibc 2.36   ->  "GLIBC_2.39 not found"   cannot load it
  #     debian:trixie-slim     glibc 2.41   ->  sis 0.6.7                works
  #
  # michiel/sis now pins its Linux builds to a Debian 12 builder, which drops the floor to 2.35 and
  # makes bookworm-slim viable — but only for releases built AFTER that landed. Trixie carries both
  # the old floor and the new one, so it is correct across the switchover rather than only after it.
  # Moving to bookworm-slim later is a reviewed change, gated by the floor check below.
  RUNTIME_BASE: docker.io/library/debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
  RUNTIME_BASE_GLIBC: "2.41"

jobs:
  assemble:
    name: assemble ${{ github.event.release.tag_name || github.event.inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: cfg
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          [ -n "${tag}" ] || { echo "::error::no release tag to assemble"; exit 1; }
          # A release event publishes; a manual run validates unless explicitly told otherwise, so a
          # dry run cannot push a public image by forgetting a flag.
          if [ "${{ github.event_name }}" = "release" ]; then push=true; else push="${{ github.event.inputs.push }}"; fi
          echo "tag=${tag}"   >> "$GITHUB_OUTPUT"
          echo "push=${push}" >> "$GITHUB_OUTPUT"
          echo "Assembling ${tag} (push=${push})"

      # §9's first perturbation is "a runtime digest is replaced by a mutable tag". Applied to the
      # first draft of this workflow, it did not fail: RUNTIME_BASE was a plain string and every
      # later check passed regardless of whether it named a digest or a tag. A tag is resolved at
      # build time, so the image assembled today and the one assembled on a rerun could differ with
      # nothing recording it — the moving-input class the whole plan exists to close.
      - name: Runtime base must be digest-pinned
        run: |
          set -euo pipefail
          case "${RUNTIME_BASE}" in
            *@sha256:*) ;;
            *) echo "::error::RUNTIME_BASE is not digest-pinned: ${RUNTIME_BASE}"
               echo "  A tag resolves at build time, so two runs of the same release can assemble"
               echo "  different images with nothing recording the difference. Pin it as"
               echo "  <image>@sha256:<digest>."
               exit 1 ;;
          esac
          echo "runtime base: ${RUNTIME_BASE}"

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "${{ steps.cfg.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*-linux-gnu.tar.gz' --pattern 'SHA256SUMS' \
            --dir dl
          ls -l dl
          # A release with no Linux archives is a misconfiguration, not a no-op.
          for a in x86_64 aarch64; do
            f="dl/sis-${{ steps.cfg.outputs.tag }}-${a}-unknown-linux-gnu.tar.gz"
            [ -f "$f" ] || { echo "::error::missing ${f} on ${{ steps.cfg.outputs.tag }}"; exit 1; }
          done

      # Verify BEFORE unpacking. The checksum manifest is published for exactly this, and using bytes
      # you have not verified while claiming a content-addressed pipeline is the substitution the
      # whole exercise exists to avoid.
      - name: Verify archives against SHA256SUMS
        working-directory: dl
        run: |
          set -euo pipefail
          [ -f SHA256SUMS ] || { echo "::error::SHA256SUMS absent — cannot verify inputs"; exit 1; }
          # Check only the archives we actually consume; the manifest also covers windows/macos.
          grep -E ' sis-.*-linux-gnu\.tar\.gz$' SHA256SUMS > linux.sums
          [ -s linux.sums ] || { echo "::error::SHA256SUMS lists no linux archives"; exit 1; }
          cat linux.sums
          sha256sum -c linux.sums

      - name: Unpack per architecture
        run: |
          set -euo pipefail
          tag="${{ steps.cfg.outputs.tag }}"
          mkdir -p ctx/amd64 ctx/arm64
          tar -xzf "dl/sis-${tag}-x86_64-unknown-linux-gnu.tar.gz"  -C ctx/amd64 sis
          tar -xzf "dl/sis-${tag}-aarch64-unknown-linux-gnu.tar.gz" -C ctx/arm64 sis
          chmod +x ctx/amd64/sis ctx/arm64/sis
          # Record what the image must satisfy. These are the bytes; everything downstream is checked
          # against them.
          sha256sum ctx/amd64/sis ctx/arm64/sis | tee binary-digests.txt

      # The load-bearing check. This workflow consumes artefacts it did not build, from a release it
      # does not control — so it measures the floor itself rather than trusting a gate that ran in
      # another repository on another artefact.
      #
      # Mirrors michiel/sis:scripts/check-glibc-floor.sh. It is inlined rather than sourced because a
      # DEPLOYED workflow has no repository to source from; keep the two in step deliberately.
      - name: Guard glibc floor and shared-library needs
        run: |
          set -euo pipefail
          base_glibc="${RUNTIME_BASE_GLIBC}"
          fail=0
          for arch in amd64 arm64; do
            bin="ctx/${arch}/sis"
            needed="$(readelf -d "$bin" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' | sort | tr '\n' ' ')"
            floor="$(readelf -V "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -u -V | tail -1 | sed 's/^GLIBC_//')"
            echo "${arch}: glibc_floor=${floor:-none} needed=${needed}"
            if [ -n "${floor}" ]; then
              highest="$(printf '%s\n%s\n' "${floor}" "${base_glibc}" | sort -V | tail -1)"
              if [ "${floor}" != "${base_glibc}" ] && [ "${highest}" = "${floor}" ]; then
                echo "::error::${arch} requires glibc ${floor}, above the runtime base's ${base_glibc}."
                echo "  The image would fail at startup with: version \`GLIBC_${floor}' not found"
                echo "  Raise RUNTIME_BASE deliberately, or release artefacts built against an older glibc."
                fail=1
              fi
            fi
            # The architectures differ in linkage: the amd64 binary links system zlib and the aarch64
            # one does not, because the cross build had no aarch64 system zlib. So this is checked per
            # architecture, and a scratch/distroless-static base cannot serve both.
            echo "${needed}" > "ctx/${arch}/needed.txt"
          done
          [ "${fail}" -eq 0 ] || exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No RUN instruction anywhere: the image is a base plus a COPY. That is what lets both platforms
      # be assembled without emulating either — TARGETARCH picks the already-built binary — and it is
      # why a non-root user is expressed numerically rather than created with adduser.
      - name: Write Containerfile
        run: |
          set -euo pipefail
          # `ARG BASE` deliberately has NO default. Buildx lints that (InvalidDefaultArgInFrom),
          # but a default would be a second place the runtime base is declared, and a missing
          # build-arg would then silently build on it instead of failing. Fail-closed beats quiet.
          cat > Containerfile <<'EOF'
          ARG BASE
          FROM ${BASE}
          ARG TARGETARCH
          ARG SIS_VERSION
          ARG SIS_REVISION
          ARG SIS_DESCRIPTION
          ARG SIS_SOURCE
          ARG SIS_LICENSES

          COPY ctx/${TARGETARCH}/sis /usr/local/bin/sis

          # Numeric, so no RUN is needed to create it. 65532 is the conventional "nonroot" id.
          USER 65532:65532
          # `sis doctor` warns when the working directory is not writable; /work is the documented
          # mount point for a writable scratch, and the read-only validation below mounts a tmpfs here.
          WORKDIR /work

          LABEL org.opencontainers.image.title="sis" \
                org.opencontainers.image.description="${SIS_DESCRIPTION}" \
                org.opencontainers.image.version="${SIS_VERSION}" \
                org.opencontainers.image.revision="${SIS_REVISION}" \
                org.opencontainers.image.source="${SIS_SOURCE}" \
                org.opencontainers.image.licenses="${SIS_LICENSES}"

          ENTRYPOINT ["/usr/local/bin/sis"]
          EOF
          cat Containerfile

      - name: Build multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.push == 'true' }}
          load: false
          provenance: false      # the Sigstore attestation below is the provenance; buildx's inline
          sbom: false            # attestations would add a second, weaker claim to the same index
          tags: ${{ env.IMAGE }}:${{ steps.cfg.outputs.tag }}
          build-args: |
            BASE=${{ env.RUNTIME_BASE }}
            SIS_VERSION=${{ steps.cfg.outputs.tag }}
            SIS_REVISION=${{ github.sha }}
            SIS_DESCRIPTION=${{ env.IMAGE_DESCRIPTION }}
            SIS_SOURCE=https://github.com/${{ github.repository }}
            SIS_LICENSES=${{ env.IMAGE_LICENSES }}
          # A LABEL lands in each PLATFORM's config. GHCR's package page reads a multi-architecture
          # image's metadata from the INDEX, which has no config and therefore no labels — so the
          # first publish showed "No description provided" despite every platform config carrying
          # one. Annotations are the index's equivalent, and `index:` is what puts them there rather
          # than on a platform manifest.
          annotations: |
            index:org.opencontainers.image.title=sis
            index:org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            index:org.opencontainers.image.version=${{ steps.cfg.outputs.tag }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=${{ env.IMAGE_LICENSES }}
          outputs: ${{ steps.cfg.outputs.push == 'true' && 'type=image' || 'type=oci,dest=sis-oci.tar' }}

      # EXECUTED, not read off a manifest field. An arm64 manifest carrying the amd64 binary satisfies
      # every structural check and fails only when something tries to run it.
      - name: Validate both architectures by execution
        run: |
          set -euo pipefail
          tag="${{ steps.cfg.outputs.tag }}"
          if [ "${{ steps.cfg.outputs.push }}" = "true" ]; then
            ref="${IMAGE}:${tag}"
          else
            # The oci archive is not loadable by `docker load`; rebuild each platform locally instead.
            ref=""
          fi
          for arch in amd64 arm64; do
            if [ -z "${ref}" ]; then
              docker buildx build --platform "linux/${arch}" --load \
                --build-arg "BASE=${RUNTIME_BASE}" \
                --build-arg "SIS_VERSION=${tag}" \
                --build-arg "SIS_REVISION=${{ github.sha }}" \
                --build-arg "SIS_DESCRIPTION=${IMAGE_DESCRIPTION}" \
                --build-arg "SIS_SOURCE=https://github.com/${{ github.repository }}" \
                --build-arg "SIS_LICENSES=${IMAGE_LICENSES}" \
                -f Containerfile -t "sis-local:${arch}" .
              img="sis-local:${arch}"
            else
              img="${ref}"
            fi
            echo "── linux/${arch} ──"
            # version
            got="$(docker run --rm --platform "linux/${arch}" "${img}" --version)"
            echo "  ${got}"
            case "${got}" in *"${tag#v}"*) ;; *) echo "::error::${arch}: --version did not report ${tag}"; exit 1 ;; esac
            # non-root
            uid="$(docker run --rm --platform "linux/${arch}" --entrypoint /bin/sh "${img}" -c 'id -u')"
            [ "${uid}" = "65532" ] || { echo "::error::${arch}: runs as uid ${uid}, expected 65532"; exit 1; }
            # exit status propagates
            set +e
            docker run --rm --platform "linux/${arch}" "${img}" --no-such-flag >/dev/null 2>&1
            rc=$?
            set -e
            [ "${rc}" -ne 0 ] || { echo "::error::${arch}: a bad invocation exited 0"; exit 1; }
            # read-only root filesystem with a writable /work
            docker run --rm --platform "linux/${arch}" --read-only --tmpfs /work "${img}" --version >/dev/null
            echo "  ok: non-root, exit status propagates, runs read-only"
          done

      # The image binary must BE the published binary, not merely behave like it. Repackaging is what
      # earns this check; a from-source container build could not make the claim at all.
      - name: Byte-identity of the layer binary
        run: |
          set -euo pipefail
          tag="${{ steps.cfg.outputs.tag }}"
          for arch in amd64 arm64; do
            if [ "${{ steps.cfg.outputs.push }}" = "true" ]; then img="${IMAGE}:${tag}"; else img="sis-local:${arch}"; fi
            got="$(docker run --rm --platform "linux/${arch}" --entrypoint /bin/sh "${img}" -c 'sha256sum /usr/local/bin/sis' | awk '{print $1}')"
            want="$(sha256sum "ctx/${arch}/sis" | awk '{print $1}')"
            echo "${arch}: layer=${got} archive=${want}"
            [ "${got}" = "${want}" ] || { echo "::error::${arch}: layer binary differs from the published archive"; exit 1; }
          done

      - name: Record digests
        id: digests
        run: |
          set -euo pipefail
          if [ "${{ steps.cfg.outputs.push }}" = "true" ]; then
            index="${{ steps.build.outputs.digest }}"
            echo "index=${index}" >> "$GITHUB_OUTPUT"
            echo "index digest: ${index}"
            docker buildx imagetools inspect "${IMAGE}:${{ steps.cfg.outputs.tag }}" --raw | tee index.json
            docker buildx imagetools inspect "${IMAGE}:${{ steps.cfg.outputs.tag }}"
          else
            echo "index=" >> "$GITHUB_OUTPUT"
            echo "dry run: no index digest (nothing was pushed)"
            ls -l sis-oci.tar || true
            sha256sum sis-oci.tar || true
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.cfg.outputs.push == 'true' && format('{0}:{1}', env.IMAGE, steps.cfg.outputs.tag) || '' }}
          path: ${{ steps.cfg.outputs.push == 'true' && '' || 'ctx' }}
          format: spdx-json
          output-file: sis-sbom.spdx.json
          upload-artifact: false

      # Subject is the TOP-LEVEL index digest, so one attestation covers the multi-architecture image
      # rather than each platform manifest separately.
      - name: Attest the image index
        if: steps.cfg.outputs.push == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ORDER MATTERS, and it is the reason this sits here rather than before the attestation.
      #
      # Everything from `Build multi-architecture image` onward runs AFTER the image is public. A
      # failing step therefore cannot prevent publication — it can only stop the steps behind it. So
      # a metadata gate placed before `Attest the image index` converts a blank description into a
      # public image with NO PROVENANCE AT ALL, which is far worse than the cosmetic defect it
      # catches. Every other post-push gate here guards a load-bearing claim (it runs, it is the
      # right architecture, the bytes match the archive); this one guards a web page.
      #
      # Placed after the attestation, a metadata failure still leaves an attested image and a red
      # run telling you to fix the metadata and re-push.
      # Metadata reaches consumers through TWO mechanisms, and this checks both, because each
      # can go blank without the other noticing:
      #
      #   index annotations       what GHCR's package page reads for a multi-arch image
      #   per-platform LABELs     what `docker inspect` and most tooling read
      #
      # GHCR reported "No description provided" for an image whose every platform config carried the
      # label correctly — a silent failure, visible only on a web page nobody diffs, which survived a
      # full publish and an end-to-end verification pass.
      #
      # Three earlier versions of this gate were unsound, every one found by review:
      #
      #   grepped the raw document   `imagetools inspect --raw` includes the manifest DESCRIPTORS, so
      #                              annotations misplaced onto them (buildx's `manifest-descriptor:`
      #                              level) matched while `index.annotations` stayed empty
      #   checked keys, not values   an unknown `env` key interpolates to "" in Actions rather than
      #                              erroring, so a typo'd reference passes a presence check
      #   checked only the index     `build-args` and `annotations:` are two INDEPENDENT
      #                              interpolations nine lines apart. Deleting or typo'ing the
      #                              build-arg leaves `ARG SIS_DESCRIPTION` expanding to "" with no
      #                              lint and no build failure, and an index-only gate is green over
      #                              a blank label. Making these build args at all is what created
      #                              that reachability — they used to be literals.
      - name: Image metadata is complete on the index and every platform
        env:
          PUSHED: ${{ steps.cfg.outputs.push }}
          TAG: ${{ steps.cfg.outputs.tag }}
          EXPECTED_DESCRIPTION: ${{ env.IMAGE_DESCRIPTION }}
          EXPECTED_SOURCE: https://github.com/${{ github.repository }}
          EXPECTED_LICENSES: ${{ env.IMAGE_LICENSES }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys, tarfile

          pushed = os.environ["PUSHED"] == "true"
          image, tag = os.environ["IMAGE"], os.environ["TAG"]
          expected_description = os.environ["EXPECTED_DESCRIPTION"]
          expected_source = os.environ["EXPECTED_SOURCE"]
          expected_licenses = os.environ["EXPECTED_LICENSES"]

          KEY = "org.opencontainers.image."


          def registry(*args):
              """Run an imagetools query, surfacing the registry's own error on failure.

              `check=True` with `capture_output=True` raises CalledProcessError and DISCARDS stderr,
              so a transient network fault reads as a metadata defect — two failures that want
              opposite responses.
              """
              done = subprocess.run(args, capture_output=True, text=True)
              if done.returncode != 0:
                  print(f"::error::registry query failed: {' '.join(args)}")
                  print(done.stderr.strip() or "(no stderr)")
                  sys.exit(2)
              return done.stdout


          def wanted(kind):
              """kind is "index" or a platform string; both carry the same metadata."""
              return {
                  KEY + "title": "sis",
                  KEY + "description": expected_description,
                  KEY + "version": tag,
                  KEY + "source": expected_source,
                  KEY + "licenses": expected_licenses,
                  KEY + "revision": None,   # a commit sha; no independent expected value exists
              }


          def check(kind, present):
              problems = []
              for key, want in wanted(kind).items():
                  got = present.get(key)
                  if got is None:
                      problems.append(f"{kind}: {key} absent")
                  elif not str(got).strip():
                      problems.append(f"{kind}: {key} present but EMPTY")
                  elif want is not None and got != want:
                      problems.append(f"{kind}: {key} is {got!r}, expected {want!r}")
              return problems


          index = None
          platforms = []   # (name, labels)

          if pushed:
              index = json.loads(registry(
                  "docker", "buildx", "imagetools", "inspect", f"{image}:{tag}", "--raw"))
              for entry in index.get("manifests", []):
                  spec = entry.get("platform") or {}
                  if spec.get("architecture") in ("unknown", None):
                      continue
                  name = f"{spec.get('os')}/{spec.get('architecture')}"
                  config = json.loads(registry(
                      "docker", "buildx", "imagetools", "inspect",
                      f"{image}@{entry['digest']}", "--format", "{{json .Image}}"))
                  platforms.append((name, (config.get("config") or {}).get("Labels") or {}))
          else:
              # The dry run is the path a maintainer uses to test a metadata edit, so it is checked
              # too — the OCI layout carries the same index and the same configs.
              with tarfile.open("sis-oci.tar") as tf:
                  def blob(digest):
                      return json.load(tf.extractfile("blobs/sha256/" + digest.split(":", 1)[1]))

                  root = json.load(tf.extractfile("index.json"))
                  entry = root["manifests"][0]
                  index = blob(entry["digest"]) if entry["mediaType"].endswith("index.v1+json") else root
                  for manifest in index.get("manifests", []):
                      spec = manifest.get("platform") or {}
                      if spec.get("architecture") in ("unknown", None):
                          continue
                      name = f"{spec.get('os')}/{spec.get('architecture')}"
                      config = blob(blob(manifest["digest"])["config"]["digest"])
                      platforms.append((name, (config.get("config") or {}).get("Labels") or {}))

          failures = check("index", index.get("annotations") or {})
          print("index annotations:")
          for key, value in sorted((index.get("annotations") or {}).items()):
              print(f"  {key} = {value}")

          # WHICH platforms, not how many. The step name claims "every platform", and a count claims
          # nothing: in the dry-run path the execution gate rebuilds each architecture from the
          # Containerfile rather than reading sis-oci.tar, so a single-platform tarball would satisfy
          # it and this step would report "all 1 platforms" — true, and useless.
          expected_platforms = {"linux/amd64", "linux/arm64"}
          found_platforms = {name for name, _ in platforms}
          if found_platforms != expected_platforms:
              failures.append(
                  f"platforms are {sorted(found_platforms) or 'none'}, expected "
                  f"{sorted(expected_platforms)}"
              )
          for name, labels in platforms:
              failures.extend(check(name, labels))
              print(f"{name} labels: {len(labels)} present")

          if failures:
              for line in failures:
                  print(f"::error::{line}")
              stray = [m.get("annotations") for m in index.get("manifests", []) if m.get("annotations")]
              if stray:
                  print("::error::annotations were found on the manifest DESCRIPTORS rather than on")
                  print("  the index itself — the `annotations:` input needs the `index:` prefix.")
              print("  A LABEL reaches a platform's config; the index has no config, so it has no")
              print("  labels. Annotations are the index's equivalent. Both are required, and they")
              print("  are set by two SEPARATE inputs — `build-args` and `annotations:`.")
              sys.exit(1)

          print("metadata complete on the index and on " + ", ".join(sorted(found_platforms)))
          PY

      # `always()`, because every gate in this job runs AFTER the image is public. A failing gate
      # therefore cannot unpublish anything — it can only destroy the record of what was published.
      # The SBOM and the raw index are exactly what you need to diagnose the failure and to document
      # the release that already happened, so they must outlive it. Covers the execution and
      # byte-identity gates above too, which had this problem before the metadata gate existed.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oci-evidence-${{ steps.cfg.outputs.tag }}
          path: |
            binary-digests.txt
            sis-sbom.spdx.json
            index.json
            dl/SHA256SUMS
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "### SIS OCI image — ${{ steps.cfg.outputs.tag }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| pushed | \`${{ steps.cfg.outputs.push }}\` |"
            echo "| image | \`${IMAGE}:${{ steps.cfg.outputs.tag }}\` |"
            echo "| index digest | \`${{ steps.digests.outputs.index }}\` |"
            echo "| runtime base | \`${RUNTIME_BASE}\` |"
            echo "| base glibc | ${RUNTIME_BASE_GLIBC} |"
            echo
            echo "Provenance attests that these bytes were assembled from the published archives by"
            echo "this workflow. It is **not** a cryptographic tie to the private source commit."
          } >> "$GITHUB_STEP_SUMMARY"
